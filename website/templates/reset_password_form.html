{% extends "base.html" %}

{% block title %}Reset Password - ReVibe{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-subtitle">Reset your ReVibe account password</p>
    
    <form method="POST">
        
        <div class="form-group">
            <label for="password" class="form-label">New Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="Enter your new password"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <input 
                type="password" 
                id="confirm_password" 
                name="confirm_password" 
                class="form-input" 
                placeholder="Confirm new password"
                required
            >
        </div>
        
        <button type="submit" class="btn">Reset Password</button>
    </form>
    
    <a href="{{ url_for('auth.login') }}" class="auth-link">Back to Login
    </a>
</div>
{% endblock %}
